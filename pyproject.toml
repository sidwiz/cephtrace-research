[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cephtrace"
version = "0.4.0"
description = "Anatomy-Guided Spatial Priors for Cephalometric Landmark Detection (v4 pipeline)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "CC-BY-NC-4.0"}
authors = [
    { name = "Sidhartha Mohapatra" },
    { name = "Pallavi Mohanty, DDS" },
]
keywords = [
    "cephalometry",
    "orthodontics",
    "landmark-detection",
    "medical-imaging",
    "hrnet",
    "onnx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24,<2.3",
    "onnxruntime>=1.17,<2.0",
    "opencv-python-headless>=4.8,<5.0",
    "Pillow>=10.0,<12.0",
    "scipy>=1.11,<2.0",
    "huggingface-hub>=0.20,<1.0",
    "tqdm>=4.65,<5.0",
]

[project.optional-dependencies]
gpu = [
    "onnxruntime-gpu>=1.17,<2.0",
]
dev = [
    "pytest>=7.4,<9.0",
    "ruff>=0.4,<1.0",
]

[project.urls]
"Paper" = "https://arxiv.org/abs/2605.03358"
"Source" = "https://github.com/cephtrace-research/cephtrace-v4-public"

[project.scripts]
cephtrace-download = "scripts.download_weights:main"
cephtrace-predict = "scripts.run_inference:main"
cephtrace-evaluate = "scripts.evaluate:main"

[tool.setuptools.packages.find]
include = ["cephtrace*"]

[tool.ruff]
line-length = 100
target-version = "py39"
